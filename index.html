<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DESA BACA - Website Baca Buku 15 Menit</title>
  <meta name="description" content="Baca berbagai buku dari berbagai kategori dan genre hanya dalam 15 menit. Platform baca buku gratis dan mudah dioperasikan." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            warm: {
              bg:        '#EFE8DB',
              card:      '#F7F2E8',
              subtle:    '#E5DDCB',
              border:    '#D8CEBC',
              text:      '#231E18',
              muted:     '#695F52',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/main.css" />

  <!-- Inisialisasi tema sebelum render (cegah flash) -->
  <script>
    (function() {
      const t = localStorage.getItem('desabaca_theme') || 'dark';
      if (t !== 'dark') document.documentElement.classList.remove('dark');
    })();
  </script>
</head>

<body class="selection:bg-red-500 selection:text-white">

  <!-- Vue 3 Root App Container -->
  <div id="app" v-cloak></div>

  <!-- Vue 3 CDN (Stand-alone, tanpa build tool) -->
  <!-- Data layer mockup (localStorage). Lihat header js/store.js -->
  <script src="js/store.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <!-- Main Vue Application Script -->
  <script src="js/app.js"></script>

</body>
</html>
